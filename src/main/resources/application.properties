spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CRON_EMAIL;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Test@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#JWT Secret key
app.jwt.secret-key=hello-world-this-is-a-secret-key
app.jwt.expiration-time=3600000


# MAIL Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<email_to_send_mail>
spring.mail.password=<email_password>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
